spring.application.name=backend

# Optional local secrets file (backend/.env or ./.env). It is git-ignored - see .env.example
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

# ---- Database: defaults match docker-compose.yml. Override with env vars or .env ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/breathingroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates tables from the entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- OpenAI (optional). Without a key the app still works and shows built-in explanations ----
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Show our own validation messages (for example "Amount must be greater than 0.") to the app
server.error.include-message=always
server.error.include-stacktrace=never

# ---- Security ----
# Secret used to sign login tokens. Set JWT_SECRET (32+ characters) in backend/.env. Without it a random secret is used
# for each run and everyone is signed out when the backend restarts.
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-hours=${TOKEN_HOURS:8}
# Websites allowed to call the API from a browser (comma separated). Change this before any real deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Most AI calls one user can trigger per day (protects your OpenAI bill)
openai.daily-limit=${OPENAI_DAILY_LIMIT:40}

server.port=8080
